default_base = "main"

[[format]]
name = "rustfmt"
run = ["cargo", "fmt", "--all"]

[[check]]
name = "format"
run = ["cargo", "fmt", "--all", "--", "--check"]
fix = ["cargo", "fmt", "--all"]
on = ["commit", "validate"]

[[check]]
name = "lint"
run = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
on = ["commit", "validate"]

[[check]]
name = "tests"
run = ["cargo", "test", "--workspace"]
on = ["validate"]

[tasks]
project_number = 2
project_owner = "cmilatinov"
default_repo = "cmilatinov/lexion"
default_status = "Todo"
